schemaVersion: "2"
kind: mixin
name: vaadin-grid-ai-filter
displayName: vaadin-grid-ai-filter Vaadin dev environment
description: >-
  Vaadin skills and MCP, and Maven/Vaadin/GitHub network access. The ITs bring their
  own Ollama as a Testcontainer, so this kit provisions no model.

# vaadin-grid-ai-filte is set by `task-agent --init vaadin`. Cosmetic: only shows in `sbx kit inspect`.

setup:
  install:
    # Brings the Vaadin skills *and* the Vaadin MCP — no `sbx mcp add` needed.
    - command: "claude plugin marketplace add vaadin/agent-marketplace && claude plugin install vaadin-skills@vaadin-marketplace"
      user: "1000"

environment:
  variables:
    # Base image ships a JDK but leaves JAVA_HOME unset. Symlink, not the
    # versioned dir, which names both JDK version and CPU architecture.
    JAVA_HOME: "/usr/lib/jvm/default-java"

permissions:
  network:
    allow:
      # Maven. No `mvn` in the image; the wrapper downloads it from here.
      - repo.maven.apache.org
      - repo1.maven.org
      - central.sonatype.com

      # Claude plugin marketplace and install.
      - github.com
      - codeload.github.com
      - raw.githubusercontent.com

      # Vaadin docs, MCP, Javadoc.
      - vaadin.com
      - mcp.vaadin.com
      - www.javadocs.dev

      # `ollama pull` inside the Testcontainer's image build: the manifest comes from the registry,
      # the model blob from a 307 redirect to an R2 bucket whose hostname is a hash. Without the
      # second entry the pull fails as "max retries exceeded: EOF", because Ollama writes the 403
      # body into its download chunks.
      - registry.ollama.ai
      - "*.r2.cloudflarestorage.com"
