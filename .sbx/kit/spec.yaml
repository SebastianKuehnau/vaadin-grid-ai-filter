schemaVersion: "2"
kind: mixin
name: vaadin-grid-ai-filter
displayName: vaadin-grid-ai-filter Vaadin dev environment
description: >-
  Vaadin skills and MCP, and Maven/Vaadin/GitHub network access. The ITs bring their
  own Ollama as a Testcontainer, so this kit provisions no model.

# vaadin-grid-ai-filter is set by `task-agent --init vaadin`. Cosmetic: only shows in `sbx kit inspect`.

permissions:
  network:
    allow:
      # Maven. No `mvn` in the image; the wrapper downloads it from here.
      - repo.maven.apache.org
      - repo1.maven.org
      - central.sonatype.com

      # Claude plugin marketplace and install.
      - github.com
      - codeload.github.com
      - raw.githubusercontent.com

      # Vaadin docs, MCP, Javadoc.
      - vaadin.com
      - mcp.vaadin.com
      - www.javadocs.dev

      # `ollama pull` inside the Testcontainer's image build: the manifest comes from the registry,
      # the model blob from a 307 redirect to an R2 bucket whose hostname is a hash. Without the
      # second entry the pull fails as "max retries exceeded: EOF", because Ollama writes the 403
      # body into its download chunks.
      - registry.ollama.ai
      - "*.r2.cloudflarestorage.com"

      - auth.docker.io
      - registry-1.docker.io
      - production.cloudflare.docker.com
      - production.cloudfront.docker.com
      - registry.ollama.ai

environment:
  variables:
    # Base image ships a JDK but leaves JAVA_HOME unset. Symlink, not the
    # versioned dir, which names both JDK version and CPU architecture.
    JAVA_HOME: "/usr/lib/jvm/default-java"
    OLLAMA_HOST: http://127.0.0.1:11434
    OLLAMA_MODEL: qwen3:8b
    SPRING_AI_OLLAMA_BASE_URL: http://127.0.0.1:11434
    SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: qwen3:8b

setup:
  install:
    # Brings the Vaadin skills *and* the Vaadin MCP — no `sbx mcp add` needed.
    - command: "claude plugin marketplace add vaadin/agent-marketplace && claude plugin install vaadin-skills@vaadin-marketplace"
      user: "1000"

  startup:
    - description: Start Ollama and install qwen3:8b
      user: "0"
      background: true
      command:
        - sh
        - -lc
        - |
          set -eu
          
          container_name="sbx-ollama-qwen3"
          image="ollama/ollama:latest"
          model="qwen3:8b"
          
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            docker pull "$image"
          fi
          
          if ! docker container inspect "$container_name" >/dev/null 2>&1; then
            docker run --detach \
              --name "$container_name" \
              --restart unless-stopped \
              --publish 11434:11434 \
              --volume ollama-models:/root/.ollama \
              "$image"
          else
            docker start "$container_name" >/dev/null 2>&1 || true
          fi
          
          until docker exec "$container_name" ollama list >/dev/null 2>&1; do
            sleep 1
          done
          
          docker exec "$container_name" ollama show "$model" >/dev/null 2>&1 ||
            docker exec "$container_name" ollama pull "$model"

agentInstructions:
  content: |
    Ollama runs locally at http://127.0.0.1:11434.
    The installed default model is qwen3:8b.
