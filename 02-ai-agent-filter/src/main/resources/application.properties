vaadin.launch-browser=true
spring.application.name=02-ai-agent-filter
server.port=8082

# No profile given -> this one. Each profile file names its own ChatModel.
spring.profiles.default=ollama

logging.level.org.springframework.ai.chat.client.advisor=INFO

spring.datasource.url=jdbc:h2:mem:aigridfilter;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true

# Lets devtools notice a reinstalled 00-commons jar (it only watches directories, not jars).
spring.devtools.restart.additional-paths=../00-commons/target/classes
