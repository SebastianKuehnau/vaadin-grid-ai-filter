# Shadows src/main/resources/application.properties for this module's tests.
spring.datasource.url=jdbc:h2:mem:aigridfilter;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Which backend the ITs target; -DAI_TEST_PROFILE=openai switches to the OpenAI API.
spring.profiles.active=${AI_TEST_PROFILE:ollama}
