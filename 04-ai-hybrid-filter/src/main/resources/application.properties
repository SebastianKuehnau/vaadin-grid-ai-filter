vaadin.launch-browser=true
spring.application.name=04-ai-hybrid-filter
server.port=8084

# No profile given -> this one. Each profile file names its own ChatModel via spring.ai.model.chat,
# which is required because both model starters are on the classpath and both autoconfigure by default.
spring.profiles.default=openai

# In-memory H2 database for the demo (auto-configured from the H2 runtime dependency)
spring.datasource.url=jdbc:h2:mem:aigridfilter;DB_CLOSE_DELAY=-1

# Let Hibernate create the schema from the @Entity classes on startup
spring.jpa.hibernate.ddl-auto=create-drop

# Run data.sql AFTER Hibernate has created the schema (otherwise CUSTOMER does not exist yet)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.show-sql=true

logging.level.org.springframework.ai.chat.client.advisor=INFO

# spring-boot-devtools watches directories on the restart classpath, and demo-commons reaches the app as
# a jar from ~/.m2 — so without this line, reinstalling the shared module while the app runs changes
# nothing visible. Watching its target/classes gives devtools the trigger it lacks; the restart then picks
# up the freshly installed jar. Measured: `./mvnw install -pl demo-commons -DskipTests` restarts the app
# and the new code is live. Use install, not compile — compile updates target/classes (the trigger) but
# not the jar the app actually loads.
spring.devtools.restart.additional-paths=../demo-commons/target/classes
