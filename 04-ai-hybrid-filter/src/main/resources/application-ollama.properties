# Native Ollama binding (default backend) - "think" and "num_ctx" below are honored only here, not on
# Ollama's OpenAI-compatible endpoint. The sandbox provides Ollama at OLLAMA_BASE_URL (see .sbx/kit).
spring.ai.model.chat=ollama
# Never used for chat: the OpenAI starter (used by the openai profile) builds a client at startup regardless.
spring.ai.openai.api-key=not-needed
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen3:8b}
spring.ai.ollama.chat.temperature=0
spring.ai.ollama.chat.num-ctx=4096
# Caps the answer length: an inexpressible query can otherwise send the model into a long monologue.
spring.ai.ollama.chat.num-predict=512
# Without this, a reasoning-capable model burns hundreds of tokens on a <think> block per call.
spring.ai.ollama.chat.think=false
# Keeps the model resident, so a sporadic live-demo query pays no cold-reload penalty.
spring.ai.ollama.chat.keep-alive=1h
