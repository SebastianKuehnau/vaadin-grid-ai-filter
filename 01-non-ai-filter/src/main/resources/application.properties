vaadin.launch-browser=true
spring.application.name=01-non-ai-filter
server.port=8081

# In-memory H2 database for the demo
spring.datasource.url=jdbc:h2:mem:aigridfilter;DB_CLOSE_DELAY=-1

# Hibernate creates the schema; data.sql runs afterwards
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.show-sql=false

# Lets devtools notice a reinstalled 00-commons jar (it only watches directories, not jars).
spring.devtools.restart.additional-paths=../00-commons/target/classes
